          class Pct(c: Context) : ViewGroup(c) {
              private val RW = 2576f; private val RH = 1450f
              fun add(v: View, l: Int, t: Int, r: Int, b: Int): View { v.tag = floatArrayOf(l / RW, t / RH, r / RW, b / RH); addView(v); return v }
              fun move(v: View, l: Int, t: Int, r: Int, b: Int) { v.tag = floatArrayOf(l / RW, t / RH, r / RW, b / RH); requestLayout() }
              override fun onMeasure(wm: Int, hm: Int) {
                  val w = MeasureSpec.getSize(wm); val h = MeasureSpec.getSize(hm); setMeasuredDimension(w, h)
                  for (i in 0 until childCount) { val v = getChildAt(i); val t = v.tag as FloatArray
                      v.measure(MeasureSpec.makeMeasureSpec(maxOf(1, ((t[2] - t[0]) * w).toInt()), MeasureSpec.EXACTLY), MeasureSpec.makeMeasureSpec(maxOf(1, ((t[3] - t[1]) * h).toInt()), MeasureSpec.EXACTLY)) }
              }
              override fun onLayout(ch: Boolean, l: Int, t: Int, r: Int, b: Int) {
                  val w = (r - l).toFloat(); val h = (b - t).toFloat()
                  for (i in 0 until childCount) { val v = getChildAt(i); val a = v.tag as FloatArray
                      v.layout((a[0] * w).toInt(), (a[1] * h).toInt(), (a[2] * w).toInt(), (a[3] * h).toInt()) }
              }
          }

          class PctText(c: Context, private val k: Float, col: Int, bold: Boolean, g: Int) : TextView(c) {
              init { setTextColor(col); gravity = g; includeFontPadding = false; isSingleLine = true; if (bold) setTypeface(null, Typeface.BOLD) }
              fun put(s: String) { text = s; fit() }
              private fun fit() {
                  if (height <= 0 || width <= 0) return
                  var s = height * k; setTextSize(TypedValue.COMPLEX_UNIT_PX, s)
                  val str = text.toString()
                  while (paint.measureText(str) > width && s > 6f) { s *= 0.93f; setTextSize(TypedValue.COMPLEX_UNIT_PX, s) }
              }
              override fun onSizeChanged(w: Int, h: Int, ow: Int, oh: Int) { super.onSizeChanged(w, h, ow, oh); fit() }
          }

          class RoadView(c: Context) : View(c) {
              private var speed = 0f; private var off = 0f
              private val p = Paint(Paint.ANTI_ALIAS_FLAG); private val path = Path(); private val rr = RectF()
              fun setSpeed(k: Float) { speed = k; postInvalidateOnAnimation() }
              private fun poly(vararg v: Float) { path.reset(); path.moveTo(v[0], v[1]); var i = 2; while (i < v.size) { path.lineTo(v[i], v[i + 1]); i += 2 }; path.close() }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val cx = w / 2; val hz = h * 0.19f
                  p.style = Paint.Style.FILL
                  p.color = 0xFF5CC0F5.toInt(); poly(0f, hz, w * .06f, hz - h * .10f, w * .13f, hz - h * .05f, w * .22f, hz - h * .12f, w * .33f, hz - h * .04f, w * .5f, hz, w * .67f, hz - h * .04f, w * .78f, hz - h * .12f, w * .87f, hz - h * .05f, w * .95f, hz - h * .10f, w, hz); cv.drawPath(path, p)
                  p.color = 0xFF5BBF3A.toInt(); cv.drawRect(0f, hz, w, h, p)
                  p.color = 0xFF2E8B2E.toInt()
                  for (i in 0..24) { val x = w * i / 24f; if (Math.abs(x - cx) > w * 0.06f) { poly(x, hz - h * .07f, x - w * .01f, hz + 2f, x + w * .01f, hz + 2f); cv.drawPath(path, p) } }
                  p.color = 0xFFB8895A.toInt(); poly(cx - 3, hz, cx + 3, hz, w * .93f, h, w * .07f, h); cv.drawPath(path, p)
                  p.color = 0xFF555555.toInt(); poly(cx - 2, hz, cx + 2, hz, w * .87f, h, w * .13f, h); cv.drawPath(path, p)
                  p.color = Color.WHITE; p.style = Paint.Style.STROKE; p.strokeWidth = maxOf(3f, w * .004f)
                  cv.drawLine(cx - 2, hz, w * .13f, h, p); cv.drawLine(cx + 2, hz, w * .87f, h, p)
                  off = (off + speed * 0.004f) % 8f
                  for (i in 0 until 8) { val f = ((i + off) % 8f) / 8f; val y1 = hz + (h - hz) * f * f; val f2 = minOf(f + 0.05f, 1f); val y2 = hz + (h - hz) * f2 * f2
                      p.strokeWidth = 2f + w * .012f * f; cv.drawLine(cx, y1, cx, y2, p) }
                  p.style = Paint.Style.FILL
                  val sh = if (speed > 1) Math.sin(System.nanoTime() / 6e7).toFloat() * 1.5f else 0f
                  val cw = h * 0.1f; val ch = h * 0.3f; val top = h * 0.64f
                  val body = if (speed > 50f) 0xFFE53935.toInt() else if (speed > 20f) 0xFF2EAD4B.toInt() else 0xFFF5A623.toInt()
                  val roof = if (speed > 50f) 0xFFFF8A80.toInt() else if (speed > 20f) 0xFF7BE495.toInt() else 0xFFFFC04D.toInt()
                  p.color = body; rr.set(cx - cw + sh, top, cx + cw + sh, top + ch); cv.drawRoundRect(rr, cw * .6f, cw * .6f, p)
                  p.color = 0xFF202020.toInt(); rr.set(cx - cw * .75f + sh, top + ch * .22f, cx + cw * .75f + sh, top + ch * .40f); cv.drawRoundRect(rr, 8f, 8f, p)
                  rr.set(cx - cw * .75f + sh, top + ch * .66f, cx + cw * .75f + sh, top + ch * .80f); cv.drawRoundRect(rr, 8f, 8f, p)
                  p.color = roof; rr.set(cx - cw * .7f + sh, top + ch * .42f, cx + cw * .7f + sh, top + ch * .64f); cv.drawRoundRect(rr, 6f, 6f, p)
                  if (speed > 1) postInvalidateOnAnimation()
              }
          }

          class NeonFrame(c: Context, private val rad: Float) : View(c) {
              private val p = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.STROKE }
              private val r = RectF()
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val u = minOf(w, h) / 300f; val inset = 9f * u
                  r.set(inset, inset, w - inset, h - inset); val rr = rad * u
                  p.color = 0x1922D3FF; p.strokeWidth = 16f * u; cv.drawRoundRect(r, rr, rr, p)
                  p.color = 0x3C22D3FF; p.strokeWidth = 10f * u; cv.drawRoundRect(r, rr, rr, p)
                  p.color = 0x7822D3FF; p.strokeWidth = 5f * u; cv.drawRoundRect(r, rr, rr, p)
                  p.color = 0xFF22D3FF.toInt(); p.strokeWidth = 3f * u; cv.drawRoundRect(r, rr, rr, p)
                  p.color = 0xFFE6FBFF.toInt(); p.strokeWidth = 1.2f * u; cv.drawRoundRect(r, rr, rr, p)
              }
          }

          class GaugeView(c: Context) : View(c) {
              private val bmp: Bitmap = BitmapFactory.decodeResource(resources, R.drawable.gauge)
              private val X0 = 48f; private val Y0 = 82f; private val X1 = 644f; private val Y1 = 547f
              private val CX = 345f; private val CY = 378f
              private var shown = 0f; private var target = 0f
              private val bp = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              private val p = Paint(Paint.ANTI_ALIAS_FLAG)
              private val t = Paint(Paint.ANTI_ALIAS_FLAG).apply { textAlign = Paint.Align.CENTER; typeface = Typeface.DEFAULT_BOLD }
              private val dst = RectF(X0, Y0, X1, Y1); private val arcR = RectF()
              fun setSpeed(k: Float) { target = k.coerceIn(0f, 180f); postInvalidateOnAnimation() }
              override fun onDraw(cv: Canvas) {
                  shown += (target - shown) * 0.14f
                  val bw = X1 - X0; val bh = Y1 - Y0; val sc = minOf(width / bw, height / bh)
                  cv.save(); cv.translate((width - bw * sc) / 2 - X0 * sc, (height - bh * sc) / 2 - Y0 * sc); cv.scale(sc, sc)
                  cv.drawBitmap(bmp, null, dst, bp)
                  val a = Math.toRadians(180.0 + shown); val ca = Math.cos(a).toFloat(); val sa = Math.sin(a).toFloat()
                  arcR.set(CX - 226f, CY - 226f, CX + 226f, CY + 226f)
                  p.style = Paint.Style.STROKE; p.strokeCap = Paint.Cap.ROUND; p.shader = null
                  p.color = 0x30FF8A1F; p.strokeWidth = 30f; cv.drawArc(arcR, 180f, shown, false, p)
                  p.color = 0x66FFB02E; p.strokeWidth = 10f; cv.drawArc(arcR, 180f, shown, false, p)
                  p.color = 0x55FF6A1F; p.strokeWidth = 9f; cv.drawLine(CX + ca * 64f, CY + sa * 64f, CX + ca * 262f, CY + sa * 262f, p)
                  p.color = 0xFFFF7A1A.toInt(); p.strokeWidth = 4f; cv.drawLine(CX + ca * 64f, CY + sa * 64f, CX + ca * 262f, CY + sa * 262f, p)
                  p.color = 0xFFFFE9A0.toInt(); p.strokeWidth = 1.6f; cv.drawLine(CX + ca * 64f, CY + sa * 64f, CX + ca * 262f, CY + sa * 262f, p)
                  p.style = Paint.Style.FILL
                  p.shader = RadialGradient(CX + ca * 236f, CY + sa * 236f, 34f, intArrayOf(0xCCFFF59D.toInt(), 0x00FFD54F), null, Shader.TileMode.CLAMP)
                  cv.drawCircle(CX + ca * 236f, CY + sa * 236f, 34f, p); p.shader = null
                  t.color = 0xFFFFF1A8.toInt(); t.textSize = 46f; cv.drawText(shown.toInt().toString(), CX, 278f, t)
                  p.color = 0xFFFF8A1F.toInt(); cv.drawRect(CX - 30f, 286f, CX + 30f, 291f, p)
                  t.color = 0xFFE0A860.toInt(); t.textSize = 12f; cv.drawText("km/h", CX, 308f, t)
                  cv.restore()
                  if (Math.abs(target - shown) > 0.1f) postInvalidateOnAnimation()
              }
          }

          object Click {
              private var track: AudioTrack? = null
              fun play() {
                  try {
                      if (track == null) {
                          val sr = 22050; val n = sr / 50
                          val data = ShortArray(n) { i -> (Math.sin(2 * Math.PI * 1600 * i / sr) * Math.exp(-i / (n * 0.22)) * 7000).toInt().toShort() }
                          val t = AudioTrack.Builder()
                              .setAudioAttributes(AudioAttributes.Builder().setUsage(AudioAttributes.USAGE_ASSISTANCE_SONIFICATION).setContentType(AudioAttributes.CONTENT_TYPE_SONIFICATION).build())
                              .setAudioFormat(AudioFormat.Builder().setEncoding(AudioFormat.ENCODING_PCM_16BIT).setSampleRate(sr).setChannelMask(AudioFormat.CHANNEL_OUT_MONO).build())
                              .setBufferSizeInBytes(n * 2).setTransferMode(AudioTrack.MODE_STATIC).build()
                          t.write(data, 0, n); track = t
                      }
                      val t = track!!; t.stop(); t.reloadStaticData(); t.play()
                  } catch (e: Exception) { }
              }
          }

          class NeonButton(c: Context) : View(c) {
              private var icon: Drawable? = null; private var full = false
              private val p = Paint(Paint.ANTI_ALIAS_FLAG); private val r = RectF(); private val ri = RectF(); private val clip = Path()
              init { isClickable = true }
              fun setIcon(d: Drawable?, fill: Boolean) { icon = d; full = fill; invalidate() }
              override fun setPressed(pr: Boolean) { super.setPressed(pr); invalidate() }
              override fun onDraw(cv: Canvas) {
                  val w = width.toFloat(); val h = height.toFloat(); val u = minOf(w, h) / 100f
                  val ins = 7f * u; r.set(ins, ins, w - ins, h - ins); val rad = 20f * u
                  p.style = Paint.Style.STROKE
                  p.color = 0x1922D3FF; p.strokeWidth = 12f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.color = 0x4022D3FF; p.strokeWidth = 6f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.style = Paint.Style.FILL
                  p.shader = LinearGradient(0f, r.top, 0f, r.bottom, intArrayOf(0xFF0B1A4A.toInt(), 0xFF030A22.toInt()), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(r, rad, rad, p); p.shader = null
                  icon?.let { d ->
                      if (full) {
                          val m = 3.2f * u; ri.set(r.left + m, r.top + m, r.right - m, r.bottom - m)
                          clip.reset(); clip.addRoundRect(ri, rad - m, rad - m, Path.Direction.CW)
                          cv.save(); cv.clipPath(clip); d.setBounds(ri.left.toInt(), ri.top.toInt(), ri.right.toInt(), ri.bottom.toInt()); d.draw(cv); cv.restore()
                      } else {
                          val m = 26f * u; d.setBounds((r.left + m).toInt(), (r.top + m * .9f).toInt(), (r.right - m).toInt(), (r.bottom - m * .9f).toInt()); d.draw(cv)
                      }
                  }
                  p.shader = LinearGradient(0f, r.top, 0f, r.bottom, intArrayOf(0x38FFFFFF, 0x00FFFFFF, 0x00000000, 0x50000000), null, Shader.TileMode.CLAMP)
                  cv.drawRoundRect(r, rad, rad, p); p.shader = null
                  p.style = Paint.Style.STROKE
                  p.color = 0xFF22D3FF.toInt(); p.strokeWidth = 2.8f * u; cv.drawRoundRect(r, rad, rad, p)
                  p.color = 0xFFE6FBFF.toInt(); p.strokeWidth = 1f * u; cv.drawRoundRect(r, rad, rad, p)
                  if (isPressed) {
                      p.style = Paint.Style.FILL; p.color = 0x77000000; cv.drawRoundRect(r, rad, rad, p)
                      p.style = Paint.Style.STROKE; p.color = 0xAA22D3FF.toInt(); p.strokeWidth = 5f * u; cv.drawRoundRect(r, rad, rad, p)
                  }
              }
          }
